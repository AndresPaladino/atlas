[project]
name = "atlas"
version = "0.3.0"
description = "Atlas CLI: backend del knowledge graph (validate/lint/index/session) + extracción de PDFs (PDF → markdown+LaTeX+captions)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andres Paladino" }]

# Núcleo liviano: el knowledge tooling (validate, lint, index, session) solo
# necesita parsear frontmatter. NO arrastra torch/marker — `atlas lint` no debe
# exigir 8 GB de modelos. La extracción de PDFs vive en el extra [extract].
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
]

[project.scripts]
atlas = "atlas_local.cli:app"
atlas-mcp = "atlas_local.mcp_server:main"

[project.optional-dependencies]
# Extracción de PDFs (pesada, GPU). marker trae torch como dep transitiva.
extract = [
    # Extracción primaria: marker preserva LaTeX y extrae imágenes.
    "marker-pdf>=1.2.0",
    # Fallback de extracción (prosa / CPU / cuando marker no está disponible).
    "markitdown>=0.0.1a2",
    # Cliente para captions de figuras vía Ollama (Qwen2.5-VL). Opcional en runtime.
    "ollama>=0.3.0",
    # Recorte de PDFs en lotes de páginas (extracción de docs gigantes sin OOM).
    "pymupdf>=1.24.0",
]
# Hook opcional LaTeX→Unicode para terminal cruda.
render = ["pylatexenc>=2.10", "sympy>=1.12"]
# Servidor MCP: expone el grafo del wiki a clientes MCP (Claude Desktop, plugins…).
mcp = ["mcp>=1.2.0"]
# Desarrollo / tests (incluye mcp para testear el servidor).
dev = ["pytest>=8.0", "mcp>=1.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_local"]

# uv resuelve el backend de torch automáticamente (cuda/mps/cpu) según la plataforma.
# El install.sh / install.ps1 exporta UV_TORCH_BACKEND=auto antes de `uv tool install`.
[tool.uv]
# torch viene como dependencia transitiva de marker-pdf; dejamos que uv elija el wheel.
