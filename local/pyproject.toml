[project]
name = "atlas-local"
version = "0.1.0"
description = "Capa de extracción local para Atlas: PDF → markdown+LaTeX+captions, en la GPU disponible (CUDA/MPS/CPU)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andres Paladino" }]

dependencies = [
    # Extracción primaria: marker preserva LaTeX y extrae imágenes; trae torch como dep.
    "marker-pdf>=1.2.0",
    # Fallback de extracción (prosa / CPU / cuando marker no está disponible).
    "markitdown>=0.0.1a2",
    # Cliente para captions de figuras vía Ollama (Qwen2.5-VL). Opcional en runtime.
    "ollama>=0.3.0",
    # CLI.
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
atlas-local = "atlas_local.cli:app"

[project.optional-dependencies]
# Hook opcional LaTeX→Unicode para terminal cruda (Fase 3).
render = ["pylatexenc>=2.10", "sympy>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_local"]

# uv resuelve el backend de torch automáticamente (cuda/mps/cpu) según la plataforma.
# El install.sh / install.ps1 exporta UV_TORCH_BACKEND=auto antes de `uv sync`.
[tool.uv]
# torch viene como dependencia transitiva de marker-pdf; dejamos que uv elija el wheel.
